# RAG retrieval benchmark — one OpenRouter key covers embeddings, rerank and
# the question-generation LLM.
#
# Step 0: `python -m bench models` prints the slugs your key can actually
# reach. Model availability moves; paste the ones you want below.

concurrency: 8
cache_path: .cache/openrouter.sqlite

corpus:
  name: "GitHub Docs help centre"
  repo: "https://github.com/github/docs.git"
  subdir: "content"          # 3,700+ public help articles, CC BY 4.0

chunking:
  target_chars: 1500         # ~375 tokens
  hard_max: 4000
  min_chars: 220

questions:
  n_chunks: 250              # x3 difficulties = ~750 questions before validation
  seed: 20261027
  model: "anthropic/claude-sonnet-4.5"
  validator_model: "anthropic/claude-sonnet-4.5"

retrieval:
  candidate_k: 20            # chunks the vector search hands to the reranker

# Two embedder families x {no reranker, reranker A, reranker B}. Family order
# matters: the first is the incumbent, the last is the challenger, and the
# report compares them. `production: true` marks the pipeline everything is
# measured against.
#
# Slugs below were confirmed against `python -m bench models` on 2026-10-27.
# Amazon has no reranker on OpenRouter, so Cohere stands in for it.
pipelines:
  - id: titan
    label: "Titan V2"
    embedder: "amazon/titan-embed-text-v2"
    family: incumbent

  - id: titan_cohere
    label: "Titan V2 + Cohere rerank"
    embedder: "amazon/titan-embed-text-v2"
    reranker: "cohere/rerank-v3.5"
    family: incumbent
    production: true

  - id: titan_qwen
    label: "Titan V2 + Qwen3 rerank"
    embedder: "amazon/titan-embed-text-v2"
    reranker: "qwen/qwen3-reranker-8b"
    family: incumbent

  - id: large
    label: "3-large"
    embedder: "openai/text-embedding-3-large"
    dimensions: 3072
    family: challenger

  - id: large_cohere
    label: "3-large + Cohere rerank"
    embedder: "openai/text-embedding-3-large"
    dimensions: 3072
    reranker: "cohere/rerank-v3.5"
    family: challenger

  - id: large_qwen
    label: "3-large + Qwen3 rerank"
    embedder: "openai/text-embedding-3-large"
    dimensions: 3072
    reranker: "qwen/qwen3-reranker-8b"
    family: challenger

# Other slugs `bench models` reported, if you want to widen the matrix:
#   embedders  qwen/qwen3-embedding-8b, voyageai/voyage-4-large,
#              google/gemini-embedding-2, baai/bge-m3,
#              intfloat/multilingual-e5-large (good for non-English corpora),
#              nvidia/nemotron-3.5-embed-8b:free
#   rerankers  cohere/rerank-4-pro, voyageai/rerank-3,
#              nvidia/nemotron-3.5-rerank-8b:free
#
# `input_type: true` sends search_query / search_document. Asymmetric models
# (Cohere, Voyage, Nvidia embeddings) need it; OpenAI's and Titan do not.
